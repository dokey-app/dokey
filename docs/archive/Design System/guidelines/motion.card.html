<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--surface-card)}</style></head><body><style>@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}</style>
<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:12px"><div style="width:150px;overflow:hidden"><div style="width:22px;height:22px;border-radius:var(--radius-sm);background:var(--accent-500);animation:slide 2.4s var(--ease-standard) infinite"></div></div><span style="font:var(--type-code-sm);color:var(--text-strong);width:190px">--duration-fast 130ms · ease-standard</span><span style="font:var(--type-caption);color:var(--text-muted)">кнопки, ховеры, поля</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:150px;overflow:hidden"><div style="width:22px;height:22px;border-radius:var(--radius-sm);background:var(--accent-500);animation:slide 2.4s var(--ease-out) infinite"></div></div><span style="font:var(--type-code-sm);color:var(--text-strong);width:190px">--duration-normal 200ms · ease-out</span><span style="font:var(--type-caption);color:var(--text-muted)">поповеры, тосты</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:150px;overflow:hidden"><div style="width:22px;height:22px;border-radius:var(--radius-sm);background:var(--accent-500);animation:slide 2.4s var(--ease-out) infinite"></div></div><span style="font:var(--type-code-sm);color:var(--text-strong);width:190px">--duration-slow 320ms · ease-out</span><span style="font:var(--type-caption);color:var(--text-muted)">модалки, шторки</span></div></div></body></html>
