<!-- @dsCard group="Shape" viewport="700x160" name="Focus & states" subtitle="Кольцо фокуса, hover, disabled" -->
<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--surface-card)}</style></head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<span style="height:34px;padding:0 14px;display:inline-flex;align-items:center;border-radius:var(--radius-md);background:var(--action-primary);color:#fff;font:var(--type-ui)">Rest</span>
<span style="height:34px;padding:0 14px;display:inline-flex;align-items:center;border-radius:var(--radius-md);background:var(--action-primary-hover);color:#fff;font:var(--type-ui)">Hover</span>
<span style="height:34px;padding:0 14px;display:inline-flex;align-items:center;border-radius:var(--radius-md);background:var(--action-primary-active);color:#fff;font:var(--type-ui);transform:translateY(0.5px)">Active</span>
<span style="height:34px;padding:0 14px;display:inline-flex;align-items:center;border-radius:var(--radius-md);background:var(--action-primary);color:#fff;font:var(--type-ui);box-shadow:var(--ring-focus)">Focus</span>
<span style="height:34px;padding:0 14px;display:inline-flex;align-items:center;border-radius:var(--radius-md);background:var(--action-primary);color:#fff;font:var(--type-ui);opacity:.45">Disabled</span></div>
<div style="margin-top:14px;font:var(--type-caption);color:var(--text-muted)">Кольцо: 2px фон + 4px accent-500/55%. Press — сдвиг на 0.5px, без масштабирования.</div></body></html>
