# ADR-10: Cloudflare Workers со статическими ассетами. Серверного рантайма у продукта нет —
# Worker здесь только раздаёт собранный каталог (ADR-13).
name = "dokey"
compatibility_date = "2026-09-01"

# Телеметрия wrangler выключена явно. Для продукта, чьё обещание — ноль исходящих запросов,
# инструмент сборки, отправляющий метрики наружу, — плохая шутка (ИНВ-01).
send_metrics = false

# Прод отвечает только на своём домене. Привязку Custom Domain заводит ROLE-03 один раз в панели
# Cloudflare — у токена деплоя нет права на маршруты (D-179); здесь она повторена, чтобы адрес
# прода читался в репозитории, а деплой её не менял.
routes = [{ pattern = "dokey.ru", custom_domain = true }]

# Второго адреса у прода нет: *.workers.dev и preview-адреса шли бы мимо зоны, мимо домена
# из ИНТ-09 и мимо редиректа http→https (D-175).
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
# Заголовки ответа приходят из dist/_headers, который кладёт туда `pnpm build`
# из единственного источника infra/headers/_headers (ST-03).
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = false
