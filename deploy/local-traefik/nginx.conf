# Mirrors Cloudflare Workers static assets (wrangler.toml): `/jwt` serves jwt.html
# (html_handling = auto-trailing-slash), unknown paths get 404.html. Security headers come from
# public/_headers via the generated dokey-headers.conf — one source of truth.

# add_header in a nested location drops the parent's headers, so the per-path cache rule of
# _headers (`/_astro/*` immutable) is a map, not a location block.
map $uri $dokey_cache_control {
    ~^/_astro/   "public, max-age=31536000, immutable";
    /robots.txt  "public, max-age=3600";
    default      "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    include /etc/nginx/dokey-headers.conf;
    add_header Cache-Control $dokey_cache_control always;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # `/jwt/` serves jwt.html too, as Cloudflare does for file-format pages.
    location ~ ^(.+)/$ {
        try_files $1.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
