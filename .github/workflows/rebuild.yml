# Расписание пересборки образа (US-051, этап Э-9).
#
# ВНИМАНИЕ: адрес заведён в Э-0 вместе с остальным конвейером; предмет — профиль
# selfhosted — появляется в Э-9. До тех пор пересборка запускается только вручную:
# расписание без предмета создаёт зелёные прогоны, которые ничего не означают.
name: Rebuild

on:
  workflow_dispatch:
  # schedule: включается задачей этапа Э-9 вместе с профилем selfhosted (US-051).

permissions:
  contents: read
  packages: write

# Потолок времени есть у каждого job: без `timeout-minutes` зависший прогон держит раннер
# 6 часов умолчания GitHub (T-228 — RUN-03, T-244 — job'ы `pr.yml`, T-249 — `release.yml`,
# T-251 — этот). Правило машинное: `tests/unit/workflow-timeouts.test.ts` (RUN-01) валит новый
# job без потолка, и исключений из него больше нет.
jobs:
  rebuild:
    name: Пересобрать образ последнего тега
    runs-on: ubuntu-latest
    # Зелёного прогона нет и быть не может: workflow не запускался ни разу (расписание
    # выключено, `workflow_dispatch` никто не звал), поэтому значение берётся от состава шагов,
    # как у `image` в `release.yml`, а не от замера, и это сказано прямо. Состав — один `run` с
    # двумя `echo`: ни checkout, ни установки зависимостей, ни сети, секунды на раннере.
    # 5 минут — нижнее значение, уже принятое в `pr.yml` для `lint` и `typecheck`, где к тому же
    # шагу добавлены checkout и `pnpm install`; заглушке этого хватает с многократным запасом.
    # Мельче ставить нечего: потолок здесь заменяет 6 часов умолчания, а не отмеряет работу.
    # Предмет пересборки появляется в Э-9 (US-051) — тогда значение и уточняется по её составу.
    timeout-minutes: 5
    steps:
      - name: Заглушка этапа Э-0
        run: |
          echo "Предмет пересборки появляется в Э-9 (US-051)."
          echo "Сейчас образ собирается только релизным конвейером по тегу."
