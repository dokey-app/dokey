# Расписание пересборки образа (US-051, этап Э-9).
#
# ВНИМАНИЕ: адрес заведён в Э-0 вместе с остальным конвейером; предмет — профиль
# selfhosted — появляется в Э-9. До тех пор пересборка запускается только вручную:
# расписание без предмета создаёт зелёные прогоны, которые ничего не означают.
name: Rebuild

on:
  workflow_dispatch:
  # schedule: включается задачей этапа Э-9 вместе с профилем selfhosted (US-051).

permissions:
  contents: read
  packages: write

jobs:
  rebuild:
    name: Пересобрать образ последнего тега
    runs-on: ubuntu-latest
    steps:
      - name: Заглушка этапа Э-0
        run: |
          echo "Предмет пересборки появляется в Э-9 (US-051)."
          echo "Сейчас образ собирается только релизным конвейером по тегу."
