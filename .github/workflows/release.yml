# Релизный конвейер (T-015, T-022, T-023, TECH-05, TECH-09, TECH-10, ADR-15).
# Тег -> сборка -> гейты -> прод -> образ -> подпись, provenance, SBOM. Одним шагом.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.3.4'
  IMAGE: ghcr.io/${{ github.repository }}

# Потолок времени есть у каждого job: без `timeout-minutes` зависший прогон держит раннер
# 6 часов умолчания GitHub (T-228 — RUN-03, T-244 — job'ы `pr.yml`, T-249 — эти два).
# Релизный прогон пока один — `v0.0.0` от 2026-09-18, — поэтому запас берётся не от сорока
# прогонов, как в `pr.yml`, а от того, что в нём измерено, и от состава невыполненных шагов;
# порядок запаса тот же, что там, — 5–11x к худшему зелёному.
# Правило машинное: `tests/unit/workflow-timeouts.test.ts` (RUN-01) валит новый job без потолка.
jobs:
  gates:
    name: Гейты релиза
    runs-on: ubuntu-latest
    # Единственный зелёный прогон — 2 мин 06 с: `pnpm gates` 78 с, загрузка браузера
    # Playwright 27 с, сборка 2 с. Запас 7x, а не 5x, как у сборки в `pr.yml` (107 с, 10 мин):
    # здесь к тому же составу добавлена загрузка браузера, а она зависит от сети, и гейты
    # включаются по мере появления предмета — сейчас исполняются не все четырнадцать.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm gates
      - run: pnpm gate:headers-parity
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Прод
    needs: gates
    runs-on: ubuntu-latest
    environment: production
    # Висящий деплой не занимает раннер до предела в 6 часов (урок T-228).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # ADR-10: Cloudflare Workers со статическими ассетами. Версию wrangler держит lockfile
      # (4.129.0), токен — секрет environment `production` с одним правом (D-162, D-179).
      - name: Деплой через wrangler
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `send_metrics = false` в wrangler.toml не убрал баннер телеметрии в релизе v0.0.0;
          # переменная окружения выключает её независимо от чтения конфига (ИНВ-01).
          WRANGLER_SEND_METRICS: 'false'
      # RUN-16: живой origin обязан отдавать ровно то, что объявлено в _headers.
      # Край Cloudflare переключается на новую версию не мгновенно: в релизе v0.0.0 сверка через
      # 0,5 с после деплоя увидела прежний Worker, через 40 с — новый. Повторы — до минуты.
      - name: Сверка заголовков прода
        env:
          DOKEY_TARGET: https://dokey.ru
        run: |
          for attempt in 1 2 3 4 5 6; do
            node --experimental-strip-types scripts/check-headers.ts && exit 0
            sleep 10
          done
          exit 1

  image:
    name: Образ, подпись, provenance, SBOM
    needs: gates
    runs-on: ubuntu-latest
    # Зелёного прогона у этого job ещё не было: в `v0.0.0` он упал на установке cosign через
    # 40 с, успев собрать и опубликовать образ (25 с) и аттестацию provenance (4 с). Остаток —
    # подпись keyless, SBOM через syft и системный прогон образа — не измерен; по составу шагов
    # это ещё 2–3 мин, и почти всё в них — обращения к сети (ghcr, Sigstore, база syft).
    # Отсюда запас ~6x к оценке в 3 мин, а не к замеру; значение уточняется по первому зелёному.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Без id-token: write keyless-подпись cosign не работает. Это ровно тот факт,
      # ради которого образ переехал в Э-0, а не в декабрь (implementation-plan §2.3).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          provenance: true
          sbom: true

      - name: Provenance-аттестация
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v3.1.3'
      - name: Подпись keyless
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: dokey-sbom.spdx.json
          syft-version: 'v1.51.1'

      # RUN-14: образ обязан подняться и не сделать ни одного сетевого обращения.
      - name: Системный прогон образа
        run: |
          docker run -d --name dokey-check -p 8080:8080 "${IMAGE}@${DIGEST}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null -w 'health: %{http_code}\n' http://127.0.0.1:8080/health/
          docker rm -f dokey-check
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}
