# Релизный конвейер (T-015, T-022, T-023, TECH-05, TECH-09, TECH-10, ADR-15).
# Тег -> сборка -> гейты -> прод -> образ -> подпись, provenance, SBOM. Одним шагом.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.3.4'
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  gates:
    name: Гейты релиза
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm gates
      - run: pnpm gate:headers-parity
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Прод
    needs: gates
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # ADR-10: Cloudflare Workers со статическими ассетами, wrangler 4.129.0.
      - name: Деплой через wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
      # RUN-16: живой origin обязан отдавать ровно то, что объявлено в _headers.
      - name: Сверка заголовков прода
        env:
          DOKEY_TARGET: https://dokey.ru
        run: node --experimental-strip-types scripts/check-headers.ts

  image:
    name: Образ, подпись, provenance, SBOM
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Без id-token: write keyless-подпись cosign не работает. Это ровно тот факт,
      # ради которого образ переехал в Э-0, а не в декабрь (implementation-plan §2.3).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          provenance: true
          sbom: true

      - name: Provenance-аттестация
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v3.1.3'
      - name: Подпись keyless
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: dokey-sbom.spdx.json
          syft-version: 'v1.51.1'

      # RUN-14: образ обязан подняться и не сделать ни одного сетевого обращения.
      - name: Системный прогон образа
        run: |
          docker run -d --name dokey-check -p 8080:8080 "${IMAGE}@${DIGEST}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null -w 'health: %{http_code}\n' http://127.0.0.1:8080/health/
          docker rm -f dokey-check
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}
