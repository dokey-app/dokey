name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Деплой main не прерываем на полпути; PR — прерываем более новым коммитом.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.3.4'

# У каждого job есть timeout-minutes: зависший прогон иначе держит раннер 6 часов.
jobs:
  check:
    name: Lint, types, unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit

  e2e:
    name: Build, e2e, invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to dokey.ru
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Не `wrangler deploy`: он синхронизирует маршруты, а у токена нет на них права —
      # Custom Domain привязан в панели (decisions.md № 6). Версия загружается и
      # выкатывается на 100 % без касания маршрутов.
      - name: Upload and deploy Worker version
        run: |
          pnpm exec wrangler versions upload --tag "$GITHUB_SHA" --message "main $GITHUB_SHA"
          pnpm exec wrangler versions deploy --version-tag "$GITHUB_SHA@100%" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      # Край Cloudflare переключается на новую версию за ~40 с — повторяем до минуты.
      - name: Prod serves CSP 'self'
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -sfI https://dokey.ru/ | grep -qi "^content-security-policy: default-src 'self'; script-src 'self'; connect-src 'self'" && exit 0
            sleep 10
          done
          echo "dokey.ru не отдаёт ожидаемый CSP" >&2
          exit 1
