# Конвейер PR (T-013, TECH-05, US-047). Семь проверок; защита `main` и обязательность
# статусов — T-014: на 2026-09-23 `main` не защищён (`gh api
# repos/dokey-app/dokey/branches/main/protection` → 404 «Branch not protected»,
# `gh api repos/dokey-app/dokey/rulesets` → `[]`), то есть исход этих семи проверок
# влитию пока не препятствует. Состояние проверяется у GitHub, а не по блоку `on:`.
# Датированный факт снимает T-014 — вместе с включением защиты: шапка этого файла для того и
# входит в её границы (docs/tasks.md, строка T-014), иначе снять его было бы некому.
name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.3.4'

# Потолок времени есть у каждого job: без `timeout-minutes` зависший прогон держит раннер
# 6 часов умолчания GitHub (T-228 — RUN-03, T-244 — остальные пять, T-019 — негативный прогон
# гейтов). Значения — не круглые числа с потолка, а запас к худшему зелёному прогону из сорока
# последних (pr.yml, сентябрь 2026): линт 27 с, типы 31 с, RUN-01 20+9 с, RUN-02 77 с, e2e 86 с,
# сборка и гейты 107 с. У `gates-negative` истории ещё нет — там запас взят у соседа.
# Запас ~10x на лёгких job'ах и ~6x на тяжёлых переживает холодный кеш pnpm, загрузку
# браузера Playwright и медленный раннер, но обрывает зависание за минуты, а не за часы.
# Правило машинное: `tests/unit/workflow-timeouts.test.ts` (RUN-01) валит новый job без потолка.
jobs:
  lint:
    name: Линт и формат
    runs-on: ubuntu-latest
    # Худший зелёный — 27 с: oxlint и Prettier по дереву, сети после установки нет.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Типы
    runs-on: ubuntu-latest
    # Худший зелёный — 31 с: `astro sync` и tsc; растёт с числом маршрутов, не с сетью.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: RUN-01 unit
    runs-on: ubuntu-latest
    # Худший зелёный — 29 с. Случаи поднимают дочерние процессы и на загруженной машине
    # идут дольше (T-238, T-241), поэтому запас не срезан к минуте.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration:
    name: RUN-02 browser mode
    runs-on: ubuntu-latest
    # Худший зелёный — 77 с, и почти всё это `playwright install --with-deps chromium`:
    # загрузка браузера зависит от сети, поэтому потолок тот же, что у e2e, — 10 мин.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:int

  e2e:
    name: RUN-03 e2e
    runs-on: ubuntu-latest
    # Потолок = «готово» T-228: зелёный прогон укладывается в 10 мин (обычно ~2), а
    # зависший обрывается здесь, а не через 6 ч умолчания GitHub.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Сборка и гейты
    runs-on: ubuntu-latest
    # Худший зелёный — 107 с, самый долгий job конвейера. Гейты включаются по мере
    # появления предмета (сейчас исполняются не все четырнадцать), поэтому запас взят
    # с ростом: 10 мин — как у e2e и RUN-02.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Четырнадцать адресов гейтов; исполняются те, у кого есть предмет.
      - run: pnpm gates
      # Две копии заголовков ответа обязаны совпадать (ST-03, Q-158).
      - run: pnpm gate:headers-parity

  gates-negative:
    name: Гейты на нарушающей сборке
    runs-on: ubuntu-latest
    # Job заведён этой задачей, истории прогонов у него ещё нет, и потолок взят не с неё, а у
    # соседа той же природы — RUN-01 unit (5 мин при худшем зелёном 29 с): случаи так же
    # поднимают дочерние процессы и на занятых ядрах идут дольше. Локально набор — 13 с.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # D-106 п. 1 и п. 3, NFR-17: гейт обязан быть проверен на срабатывание, а проверка —
      # входить в конвейер, а не запускаться в момент заведения гейта. Самопроверки покрытия
      # (п. 2) здесь пока нет — её заводит T-261. Каждый случай строит свою нарушающую фикстуру
      # во временном каталоге, поэтому `pnpm build` этому job'у не нужен.
      - run: pnpm test:gates:negative
