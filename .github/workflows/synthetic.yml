# Синтетическая проверка прода (T-031, Q-156).
#
# ВНИМАНИЕ: задача T-031 помечена открытым вопросом Q-156 — чем именно наблюдается прод
# и что считается отказом, не решено. Здесь заведён адрес и минимальная проверка живости;
# состав проверок и порог тревоги дописывает T-031 после закрытия Q-156.
name: Synthetic

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Потолок времени есть у каждого job: без `timeout-minutes` зависший прогон держит раннер
# 6 часов умолчания GitHub (T-228 — RUN-03, T-244 — job'ы `pr.yml`, T-249 — `release.yml`,
# T-251 — этот). Здесь дыра опаснее, чем в остальных файлах: запуск идёт по расписанию каждые
# 6 часов, то есть зависший прогон доживал ровно до следующего и шёл с ним внахлёст.
# Правило машинное: `tests/unit/workflow-timeouts.test.ts` (RUN-01) валит новый job без потолка.
jobs:
  probe:
    name: Прод отвечает и отдаёт объявленные заголовки
    runs-on: ubuntu-latest
    # Зелёного прогона нет: workflow не запускался ни разу (`gh run list --workflow synthetic.yml`
    # пуст), поэтому значение берётся от состава шагов, как у `image` в `release.yml`, а не от
    # замера, и это сказано прямо. Состав — checkout, setup-node без `pnpm install` и без кеша,
    # один запрос к проду: в `pr.yml` та же голова вместе с установкой зависимостей и линтом
    # укладывается в 5 минут, здесь установки нет, так что зелёный прогон — меньше минуты.
    # 10 минут — потолок шага сверки (2 мин) плюс голова с многократным запасом; против
    # расписания `17 */6 * * *` это 3% интервала, нахлёста прогонов не будет. Уточняется по
    # первому зелёному прогону и по составу проверок, который допишет T-031 после Q-156.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Потолок шага, а не только job'а: при исчерпании `timeout-minutes` job'а GitHub job
      # отменяет, а `failure()` на отменённом прогоне ложно — шаг тревоги ниже не исполнится, и
      # зависание осталось бы без issue, то есть ровно тем немым отказом, против которого
      # синтетика и заведена. Потолок шага исчерпывается иначе: шаг падает, job продолжается,
      # `failure()` истинно, issue заводится. Значение — 2 минуты: нормальный проход единственного
      # `fetch` до dokey.ru — около секунды, а собственные таймауты undici (300 с на заголовки и
      # на тело) до потолка job'а не доводят, но и тревогу задерживают на пять минут впустую.
      - name: Сверка заголовков
        timeout-minutes: 2
        env:
          DOKEY_TARGET: https://dokey.ru
        run: node --experimental-strip-types scripts/check-headers.ts
      - name: Завести issue при провале
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Синтетика: прод не прошёл проверку ${context.runId}`,
              labels: ['дефект', 'прод'],
              body: `Прогон: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
