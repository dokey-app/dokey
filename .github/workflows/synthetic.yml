# Синтетическая проверка прода (T-031, Q-156).
#
# ВНИМАНИЕ: задача T-031 помечена открытым вопросом Q-156 — чем именно наблюдается прод
# и что считается отказом, не решено. Здесь заведён адрес и минимальная проверка живости;
# состав проверок и порог тревоги дописывает T-031 после закрытия Q-156.
#
# ВНИМАНИЕ: сам workflow в GitHub выключен вручную (`state: disabled_manually` с 2026-09-17,
# через 26 секунд после заведения; остальные три workflow репозитория — `active`). У
# выключенного workflow не срабатывает ни один триггер, расписание ниже в том числе: прогонов
# нет ни одного, и прод сейчас не наблюдается ничем — ни этой проверкой, ни чем-либо другим
# (Q-156, D-108, ЧЛ-37). Включение — действие человека в GitHub, а не правка файла: коммит его
# не делает, и происходит оно в T-031 вместе с составом проверок.
name: Synthetic

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Потолок времени есть у каждого job: без `timeout-minutes` зависший прогон держит раннер
# 6 часов умолчания GitHub (T-228 — RUN-03, T-244 — job'ы `pr.yml`, T-249 — `release.yml`,
# T-251 — этот). Ставится он до включения, а не после: включают workflow одним действием в
# GitHub, без правки файла и без прогона проверок, поэтому к первому же прогону файл обязан
# быть готов. Когда включат, дыра здесь опаснее, чем в остальных файлах: расписание даёт прогон
# каждые 6 часов, и 6 часов умолчания GitHub — ровно интервал, то есть зависший прогон дожил бы
# до следующего и пошёл с ним внахлёст (своего `concurrency` у этого workflow нет).
# Правило машинное: `tests/unit/workflow-timeouts.test.ts` (RUN-01) валит новый job без потолка.
jobs:
  probe:
    name: Прод отвечает и отдаёт объявленные заголовки
    runs-on: ubuntu-latest
    # Зелёного прогона нет: workflow выключен и не запускался ни разу (`gh run list --workflow
    # synthetic.yml` пуст), поэтому значение берётся от состава шагов, как у `image` в
    # `release.yml`, а не от замера, и это сказано прямо. Состав — checkout, setup-node без
    # `pnpm install` и без кеша, один запрос к проду: в `pr.yml` та же голова вместе с установкой
    # зависимостей и линтом укладывается в 5 минут, здесь установки нет, так что зелёный прогон —
    # меньше минуты. 10 минут — потолок шага сверки (2 мин) плюс голова с многократным запасом;
    # против расписания `17 */6 * * *` это 3% интервала, так что нахлёста прогонов не будет и
    # когда расписание заработает. Уточняется по первому зелёному прогону и по составу проверок,
    # который допишет T-031 после Q-156.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Потолок шага, а не только job'а: он исчерпывается падением шага, а не отменой job —
      # job продолжается, вердикт остаётся «проверка не прошла», и тревога уходит обычным путём
      # за две минуты вместо десяти. Потолок job'а — предохранитель на всё остальное (`Set up
      # job`, checkout, setup-node), и он исполняется отменой, поэтому условие шага тревоги ниже
      # покрывает и её. Значение — 2 минуты: нормальный проход единственного `fetch` до dokey.ru —
      # около секунды, а собственные таймауты undici (300 с на заголовки и на тело) до потолка
      # job'а не доводят, но и тревогу задерживают впустую.
      - name: Сверка заголовков
        id: headers
        timeout-minutes: 2
        env:
          DOKEY_TARGET: https://dokey.ru
        run: node --experimental-strip-types scripts/check-headers.ts
      # Условие покрывает оба вида отказа, а не только падение команды. Потолок job'а GitHub
      # исполняет отменой, и отменой же кончается зависание любого шага без своего потолка
      # (`Set up job`, checkout, setup-node), а `failure()` на отменённом прогоне ложно — с одним
      # `failure()` шаг пропускался бы ровно в том случае, ради которого синтетика заведена.
      # При отмене сервер пересчитывает условия незавершённых шагов, `cancelled()` истинно, и шаг
      # исполняется (отсрочка до 5 минут). `!success()` дал бы то же самое, но виды отказа здесь
      # перечислены поимённо: предмет проверки — что условие сверено с каждым из них.
      # Плата: отмена человеком даёт то же `cancelled`, и issue заведётся и на неё. Прогон идёт
      # меньше минуты, отменять его незачем и нечему (`concurrency` в этом workflow нет), так что
      # цена — одно закрытие руками против прода, оставшегося без наблюдения. Чтобы закрывать
      # было по чему, исход шага сверки и состояние job стоят в заголовке и теле issue: отмену по
      # потолку от отмены человеком различает уже прогон — аннотацией «exceeded the maximum
      # execution time» против «Canceled by …». Значения идут через `env`, а не подстановкой
      # `${{ }}` в текст скрипта.
      - name: Завести issue при провале
        if: ${{ failure() || cancelled() }}
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PROBE_OUTCOME: ${{ steps.headers.outcome }}
        with:
          script: |
            const status = process.env.JOB_STATUS;
            const probe = process.env.PROBE_OUTCOME || 'шаг не начинался';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title =
              probe === 'failure'
                ? `Синтетика: прод не прошёл проверку ${context.runId}`
                : `Синтетика: прогон ${context.runId} оборван до вердикта (${status})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['дефект', 'прод'],
              body: [
                `Прогон: ${run}`,
                `Состояние job: \`${status}\`. Исход сверки заголовков: \`${probe}\`.`,
                '`cancelled` — вердикта нет: прогон оборван потолком времени («exceeded the maximum execution time» в прогоне) либо отменён человеком («Canceled by …»). Во втором случае issue закрывается без разбора.',
              ].join('\n\n'),
            });
