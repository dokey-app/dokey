# Приёмник аналитики (T-026, TECH-03, ADR-11). Поднимается на собственном VPS.
# Umami 3.3.1 и PostgreSQL 18.6 пиннятся digest'ом, а не тегом: тег переезжает,
# digest — нет (tech-stack §3.3).
#
# Панель наружу не публикуется: браузер пользователя ходит только на свой origin
# через прокси /s/* (КМП-18, ИНВ-01). Порты слушают loopback.
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
    volumes:
      - umami-db:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 10s
      timeout: 5s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v3.3.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET:?задайте APP_SECRET}
      TRACKER_SCRIPT_NAME: s
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/heartbeat || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  umami-db:
