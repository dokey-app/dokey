# Заголовки ответа выводятся из infra/headers/policy.ts (D-107): после T-021 набор
# живёт в infra/docker/headers.conf и подключается сюда через `include`. До T-021 это
# вторая написанная руками копия, и её равенство первой сверяет `pnpm gate:headers-parity`.
# ИНВ-11: рантайм образа не обращается в сеть — ни резолверов, ни upstream здесь нет.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Правила кеша задаются переменной, а не блоками location. Причина в nginx, а не в вкусе:
  # `add_header` на вложенном уровне ОТМЕНЯЕТ все `add_header` уровня выше. Один
  # `add_header Cache-Control` внутри `location /_astro/` молча снял бы с хешированных
  # ассетов CSP и весь остальной набор SEC-22 — и ни один гейт этого бы не заметил.
  map $uri $dokey_cache {
    default        "public, max-age=0, must-revalidate";
    ~^/_astro/     "public, max-age=31536000, immutable";
    ~^/fonts/      "public, max-age=31536000, immutable";
    ~^/sw\.js$     "no-cache";
    ~^/robots\.txt$ "public, max-age=3600";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $dokey_cache always;

    # Собственная страница 404 появляется вместе с маршрутами реестра (T-039, Э-1).
    # До неё отдаётся ответ nginx: ссылка на несуществующий /404.html дала бы 500,
    # то есть скрыла бы отсутствие маршрута за отказом сервера.
    location / {
      try_files $uri $uri/index.html $uri.html =404;
    }
  }
}
